services:
  relay:
    image: ${EZ_RELAY_IMAGE:-ezenciel-agents:local}
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    # Init must forward shutdown to the privilege-dropped relay. The entrypoint
    # still removes every capability from the relay and its executor children.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP, KILL]
    environment:
      EZ_RUNTIME_UID: ${EZ_RUNTIME_UID:-1000}
      EZ_RUNTIME_GID: ${EZ_RUNTIME_GID:-1000}
      EZ_RELAY_UID: ${EZ_RELAY_UID:-1001}
      EZ_REPAIR_ENABLED: ${EZ_REPAIR_ENABLED:-true}
      EZ_AGENT_PURPOSE_FILE: /run/agent-purpose.md
      EZ_ISOLATION: ${EZ_ISOLATION:-}
      EZ_EXECUTOR_TRANSPORT: ${EZ_EXECUTOR_TRANSPORT:-host}
      EZ_PLUGIN_BROKER_SOCKET: ${EZ_PLUGIN_BROKER_SOCKET:-}
      EZ_CHANNEL_BACKEND_URL: ${EZ_CHANNEL_BACKEND_URL:-}
      EZ_TELEGRAM_WEB_APP: ${EZ_TELEGRAM_WEB_APP:-}
      EZ_APPLICATION_PORT: ${EZ_APPLICATION_PORT:-}
      EZ_APPLICATION_HOST: ${EZ_APPLICATION_HOST:-127.0.0.1}
      EZ_AGENT_WORKSPACE: ${EZ_AGENT_WORKSPACE:?Set this agent workspace}
      EZ_CONTROL_DIR: ${EZ_CONTROL_DIR:?Set this agent control directory}
      EZ_EXECUTOR_CLI: ${EZ_EXECUTOR_CLI:?Set the host installation CLI}
      EZ_CODEX_SANDBOX: ${EZ_CODEX_SANDBOX:-}
      EZ_CODEX_AUTO_COMPACT_TOKENS: ${EZ_CODEX_AUTO_COMPACT_TOKENS:-64000}
      EZ_EXECUTOR_TIMEOUT_SECONDS: ${EZ_EXECUTOR_TIMEOUT_SECONDS:-300}
      EZ_PAGERDUTY_STOCKS_HEALTH_URL: ${EZ_PAGERDUTY_STOCKS_HEALTH_URL:-}
      EZ_PAGERDUTY_POLL_SECONDS: ${EZ_PAGERDUTY_POLL_SECONDS:-30}
      EZ_PAGERDUTY_FAILURE_THRESHOLD: ${EZ_PAGERDUTY_FAILURE_THRESHOLD:-3}
    secrets: [relay_env]
    configs:
      - source: agent_purpose
        target: /run/agent-purpose.md
    volumes:
      - ${EZ_AGENT_WORKSPACE}:/workspace
      - ${EZ_AGENT_WORKSPACE}:${EZ_AGENT_WORKSPACE}
      - ${EZ_CONTROL_DIR}:/state/control
      - ${EZ_CONTROL_DIR}:${EZ_CONTROL_DIR}
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, node, /app/docker/healthcheck.mjs]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
  plugin-broker:
    profiles: [isolated]
    image: ${EZ_RELAY_IMAGE:-ezenciel-agents:local}
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    environment:
      # Defaults keep Compose interpolation valid for host-capable deployments;
      # the broker itself rejects these placeholders if its isolated profile is enabled.
      EZ_PLUGIN_BROKER_HOME: ${EZ_TOOLS_HOME:-/nonexistent/ez-tools}
      EZ_PLUGIN_BROKER_WORKSPACE: ${EZ_AGENT_WORKSPACE:-/nonexistent/ez-workspace}
      EZ_PLUGIN_BROKER_CONTROL_DIR: ${EZ_CONTROL_DIR:-/nonexistent/ez-control}
      EZ_PLUGIN_BROKER_SOCKET: ${EZ_PLUGIN_BROKER_SOCKET:-/nonexistent/ez-control/plugin-broker.sock}
      EZ_PLUGIN_BROKER_HOST_CONFIG: ${EZ_PLUGIN_BROKER_HOST_CONFIG:-/nonexistent/host-executor.json}
      EZ_PLUGIN_BROKER_TIMEOUT_MS: ${EZ_PLUGIN_BROKER_TIMEOUT_MS:-300000}
      EZ_DOCKER_COMPOSE: standalone
      HOME: /tmp
      DOCKER_CONFIG: /tmp/docker-config
    volumes:
      - ${EZ_TOOLS_HOME:-/nonexistent/ez-tools}:${EZ_TOOLS_HOME:-/nonexistent/ez-tools}
      - ${EZ_AGENT_WORKSPACE:-/nonexistent/ez-workspace}:${EZ_AGENT_WORKSPACE:-/nonexistent/ez-workspace}:ro
      - ${EZ_CONTROL_DIR:-/nonexistent/ez-control}:${EZ_CONTROL_DIR:-/nonexistent/ez-control}
      - ${EZ_PLUGIN_BROKER_HOST_CONFIG:-/nonexistent/host-executor.json}:${EZ_PLUGIN_BROKER_HOST_CONFIG:-/nonexistent/host-executor.json}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs: [/tmp]
    entrypoint: [node, --import, /app/node_modules/tsx/dist/loader.mjs, /app/src/plugin-broker.mjs]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('node:fs'); process.exit(fs.existsSync(process.env.EZ_PLUGIN_BROKER_SOCKET) ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30
configs:
  agent_purpose:
    file: ${EZ_AGENT_PURPOSE_FILE:-./templates/agent-purpose.md}
secrets:
  relay_env:
    file: ${EZ_RELAY_ENV_FILE:?Set EZ_RELAY_ENV_FILE to the private relay env file}
