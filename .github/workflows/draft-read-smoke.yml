# Temporary integration probe; removed before final review/merge.
name: Draft asset read permission probe
on: pull_request
permissions:
  contents: read
jobs:
  read-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Read an existing draft with read-only GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/jdorado/ez-agents/releases/385442034 --jq '{id,draft,assets: [.assets[] | {id,name,size}]}'
          asset_id=$(gh api repos/jdorado/ez-agents/releases/385442034 --jq '.assets[0].id')
          gh api -H 'Accept: application/octet-stream' "repos/jdorado/ez-agents/releases/assets/$asset_id" > "$RUNNER_TEMP/draft-candidate.tgz"
          sha256sum "$RUNNER_TEMP/draft-candidate.tgz"
