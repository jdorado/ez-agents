# Generated by scripts/generate-publish-caller.mjs; review changes before merging.
name: Publish verified npm beta
on:
  workflow_dispatch:
    inputs:
      release-id:
        description: 'Numeric ID of the staged draft prerelease'
        required: true
        type: string
      version:
        description: 'Reviewed beta version staged as draft release vVERSION'
        required: true
        type: string
      source-sha:
        description: 'Full tested commit SHA; must be current main'
        required: true
        type: string
      artifact-sha256:
        description: 'SHA-256 of the exact independently verified candidate.tgz'
        required: true
        type: string
permissions: {}
jobs:
  publish:
    if: github.repository == 'jdorado/ez-agents' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      checks: read
      actions: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/npm-beta-shared.yml
    with:
      package: '@jc_stack/ez-agents'
      publisher-sha: ${{ github.sha }}
      required-checks: '["verify (22)","verify (24)","docker"]'
      release-id: ${{ inputs.release-id }}
      version: ${{ inputs.version }}
      source-sha: ${{ inputs.source-sha }}
      artifact-sha256: ${{ inputs.artifact-sha256 }}
