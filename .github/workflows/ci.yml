name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
            exit 0
          fi
          # Ubuntu runners include unrelated vendor feeds. Refresh only the
          # signed Ubuntu source needed for ffmpeg, preserving apt verification.
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          test -s "$ubuntu_sources"
          apt_options=(-o "Dir::Etc::sourcelist=$ubuntu_sources" -o "Dir::Etc::sourceparts=-")
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y ffmpeg
      - run: pnpm verify
      - run: npm run release:check
      - run: git diff --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the exact npm package in isolation
        run: |
          release_dir="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$release_dir"
          tar -xzf "$release_dir"/*.tgz -C "$release_dir"
          docker build --target test -t ezenciel-agents-tests "$release_dir/package"
          docker build --target runtime -t ezenciel-agents:local "$release_dir/package"
      - run: node docker/smoke.mjs
      - run: node docker/status-smoke.mjs
